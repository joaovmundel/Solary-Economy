name: "${project.name}"
main: "${project.mainClass}"
version: "${project.version}"
description: "${project.description}"
author: "${project.author}"
softdepend: ["Vault", "Legendchat", "PlaceholderAPI"]
# A economia precisa estar registrada no Vault antes destes plugins lerem o provedor de economia.
loadbefore: ["ChestShop", "Jobs", "Factions", "SignShop", "Shopkeepers", "MyCommand"]
load: "STARTUP"
commands:
  money:
    description: "Para ver o saldo atual"
    aliases: [coin, coins, solaryeconomy]
